services:
  - type: web
    name: appscrip-products-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build --workspace backend
    startCommand: npm run db:deploy && npm run start --workspace backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        value: "*"
